<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Paydaes ClaimGPT · 集团级 AI 报销智能平台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="/static/app.css?v=20260614k" rel="stylesheet">
  <script src="/static/i18n.js?v=20260614k"></script>
</head>
<body class="bg-slate-100 text-slate-800 overflow-hidden">

<!-- ═══════════ 顶部全局栏 ═══════════ -->
<header id="topbar" class="fixed top-0 inset-x-0 h-14 bg-white border-b border-slate-200 z-40 flex items-center px-3 md:px-5 gap-2 md:gap-4">
  <!-- 移动端菜单按钮 -->
  <button id="menu-toggle" class="md:hidden w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-600"><i class="fas fa-bars"></i></button>

  <!-- 集团 Logo + 名称 -->
  <div class="flex items-center gap-2 shrink-0">
    <div id="group-logo" class="w-8 h-8 rounded-lg bg-[#20c997] text-white font-bold flex items-center justify-center">P</div>
    <span id="group-name" class="font-bold text-slate-900 hidden sm:block"></span>
  </div>

  <!-- 集团/公司切换器 -->
  <button id="company-switch" class="flex items-center gap-1.5 px-2.5 md:px-3 h-9 rounded-lg bg-slate-50 hover:bg-slate-100 border border-slate-200 text-sm shrink-0">
    <span id="company-flag">🇸🇬</span>
    <span id="company-name" class="font-medium hidden sm:block">新加坡公司</span>
    <i class="fas fa-chevron-down text-[10px] text-slate-400"></i>
  </button>

  <div class="flex-1"></div>

  <!-- 全球合规快捷 -->
  <button id="global-btn" class="hidden md:flex items-center gap-1.5 px-3 h-9 rounded-lg hover:bg-slate-100 text-sm text-slate-600">
    <i class="fas fa-earth-asia text-cyan-500"></i><span data-i18n="topbar.global">全球合规</span>
  </button>
  <!-- 语言 -->
  <button id="lang-switch" class="flex items-center gap-1 px-2 h-9 rounded-lg hover:bg-slate-100 text-sm shrink-0">
    <span id="lang-flag">🇨🇳</span><i class="fas fa-chevron-down text-[10px] text-slate-400"></i>
  </button>
  <!-- 帮助文档 -->
  <button id="help-btn" class="w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-600 shrink-0" data-i18n-title="help.open" title="帮助文档">
    <i class="fas fa-circle-question text-base"></i>
  </button>
  <!-- 通知 -->
  <button class="relative w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-600 shrink-0">
    <i class="fas fa-bell"></i><span class="absolute top-1.5 right-2 w-1.5 h-1.5 bg-red-500 rounded-full"></span>
  </button>
  <!-- 角色/用户 -->
  <button id="role-switch" class="flex items-center gap-2 px-1.5 md:px-2 h-9 rounded-lg hover:bg-slate-100 shrink-0">
    <span id="role-avatar" class="w-7 h-7 rounded-full bg-slate-700 text-white text-xs flex items-center justify-center"><i class="fas fa-shield-halved"></i></span>
    <span id="role-name" class="text-sm font-medium hidden md:block">系统管理员</span>
    <i class="fas fa-chevron-down text-[10px] text-slate-400 hidden md:block"></i>
  </button>
  <!-- AI 唤起按钮 -->
  <button id="ai-toggle" class="flex items-center gap-1.5 px-2.5 md:px-3 h-9 rounded-lg bg-gradient-to-r from-[#2BD9C2] to-[#0d9488] text-white text-sm font-medium shrink-0">
    <i class="fas fa-robot"></i><span class="hidden sm:block" data-i18n="topbar.ai_assistant">AI 助手</span>
  </button>
</header>

<!-- ═══════════ 左侧导航树 ═══════════ -->
<aside id="sidebar" class="fixed top-14 bottom-0 left-0 w-60 bg-white border-r border-slate-200 z-30 flex flex-col transition-transform md:translate-x-0 -translate-x-full">
  <nav id="nav-tree" class="flex-1 overflow-y-auto py-3 px-2.5 space-y-0.5"></nav>
  <!-- ═══ AI 中枢状态面板(科幻活体仪表盘) ═══ -->
  <div id="core-panel" class="core-panel">
    <div class="core-scan"></div>
    <!-- 顶行:引擎 + 在线状态 -->
    <div class="core-head">
      <span class="core-engine"><i class="fas fa-bolt"></i> <span data-i18n="nav.footer_engine">LangGraph 编排引擎</span></span>
      <span class="core-online"><span class="core-pulse"></span><span data-i18n="core.online">在线</span></span>
    </div>
    <!-- 13 Agent 活跃度灯阵 -->
    <div class="core-section">
      <div class="core-label"><i class="fas fa-microchip"></i> <span data-i18n="core.agents">智能体</span>
        <b id="core-agent-active">13</b>/13 <span data-i18n="core.active">活跃</span></div>
      <div id="core-agent-grid" class="core-grid"></div>
    </div>
    <!-- 18 模块运行点阵 -->
    <div class="core-section">
      <div class="core-label"><i class="fas fa-cubes"></i> <span data-i18n="core.modules">模块</span>
        <b id="core-mod-run">18</b>/18 <span data-i18n="core.running">运行</span></div>
      <div id="core-mod-grid" class="core-mod-grid"></div>
    </div>
    <!-- 运维微指标 -->
    <div class="core-metrics">
      <span><i class="fas fa-wave-square"></i> <span data-i18n="core.latency">时延</span> <b id="core-lat">38ms</b></span>
      <span><i class="fas fa-heart-pulse core-heart"></i> <b id="core-tps">12.4</b> tps</span>
    </div>
    <div class="core-ver" data-i18n="nav.footer_version">Paydaes ClaimGPT · 集团版 V3.0</div>
  </div>
</aside>
<!-- 移动端遮罩 -->
<div id="sidebar-mask" class="fixed inset-0 top-14 bg-black/30 z-20 hidden md:hidden"></div>

<!-- ═══════════ 主工作区 ═══════════ -->
<main id="workspace" class="fixed top-14 bottom-0 left-0 right-0 md:left-60 overflow-y-auto">
  <div id="view" class="p-4 md:p-6 max-w-[1400px] mx-auto"></div>
</main>

<!-- ═══════════ AI 智能体抽屉 ═══════════ -->
<div id="ai-mask" class="fixed inset-0 bg-black/40 z-40 hidden"></div>
<aside id="ai-drawer" class="fixed top-0 bottom-0 right-0 w-full sm:w-[420px] bg-slate-50 z-50 flex flex-col translate-x-full transition-transform shadow-2xl">
  <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4 gap-2 shrink-0">
    <i class="fas fa-robot text-[#0d9488]"></i>
    <span class="font-semibold flex-1" data-i18n="ai.team">AI 智能体团队</span>
    <button id="ai-close" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500"><i class="fas fa-xmark"></i></button>
  </div>
  <!-- 智能体选择条 -->
  <div id="agent-tabs" class="flex gap-1 px-3 py-2 bg-white border-b border-slate-100 overflow-x-auto shrink-0"></div>
  <div id="ai-messages" class="flex-1 overflow-y-auto px-4 py-4 space-y-4"></div>
  <div id="ai-samples" class="px-3 pb-1.5 flex gap-1.5 flex-wrap shrink-0"></div>
  <div class="p-3 border-t border-slate-200 bg-white shrink-0">
    <div class="flex items-end gap-2">
      <input type="file" id="ai-cam-file" accept="image/*" capture="environment" class="hidden" onchange="aiOcrUpload(event)">
      <button id="ai-cam" title="拍照/上传票据识别" onclick="document.getElementById('ai-cam-file').click()" class="h-10 w-10 rounded-xl bg-slate-100 text-slate-500 hover:bg-teal-50 hover:text-teal-600 shrink-0 transition"><i class="fas fa-camera text-sm"></i></button>
      <textarea id="ai-input" rows="1" data-i18n-ph="ai.placeholder" placeholder="用大白话告诉我……" class="flex-1 resize-none rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-300 max-h-28"></textarea>
      <button id="ai-send" class="h-10 w-10 rounded-xl bg-[#20c997] text-white shrink-0"><i class="fas fa-paper-plane text-sm"></i></button>
    </div>
  </div>
</aside>

<!-- 通用下拉弹层 -->
<div id="popover" class="fixed z-50 hidden bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 min-w-[200px] max-h-[70vh] overflow-y-auto"></div>
<div id="popover-mask" class="fixed inset-0 z-40 hidden"></div>

<!-- ═══════════ 帮助文档抽屉 ═══════════ -->
<div id="help-mask" class="fixed inset-0 bg-black/40 z-[60] hidden"></div>
<aside id="help-drawer" class="fixed top-0 right-0 bottom-0 w-full max-w-2xl bg-white z-[61] shadow-2xl flex flex-col translate-x-full transition-transform duration-300">
  <!-- 头部 -->
  <header class="flex items-center gap-3 px-5 h-16 border-b border-slate-200 shrink-0 bg-gradient-to-r from-[#0d9488] to-[#2BD9C2] text-white">
    <i class="fas fa-circle-question text-2xl"></i>
    <div class="flex-1">
      <div class="font-bold text-lg leading-tight" data-i18n="help.title">帮助中心</div>
      <div class="text-xs opacity-90" data-i18n="help.subtitle">使用指南 · 系统介绍 · 常见问题</div>
    </div>
    <button id="help-close" class="w-9 h-9 rounded-lg hover:bg-white/20 flex items-center justify-center"><i class="fas fa-xmark text-lg"></i></button>
  </header>
  <!-- 选项卡 -->
  <nav id="help-tabs" class="flex border-b border-slate-200 shrink-0 px-3 gap-1 overflow-x-auto bg-slate-50"></nav>
  <!-- 内容区 -->
  <div id="help-body" class="flex-1 overflow-y-auto px-6 py-5 text-slate-700 leading-relaxed text-sm"></div>
</aside>

<script src="/static/help.js?v=20260614k"></script>

<script src="/static/app.js?v=20260614k"></script>
</body>
</html>
